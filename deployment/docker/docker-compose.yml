version: '3.8'

services:
  nova-ide:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: nova-ide
    ports:
      - "${NOVA_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_PATH=/data/agents.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-in-production}
      - REDIS_URL=redis://redis:6379
    volumes:
      - nova-data:/data
      - nova-templates:/app/templates/user
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nova-network

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nova-network

volumes:
  nova-data:
    driver: local
  nova-templates:
    driver: local
  redis-data:
    driver: local

networks:
  nova-network:
    driver: bridge
