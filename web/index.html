<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' ws: wss:; img-src 'self' data:;" />
  <title>Nova Sub-Agent IDE</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Title Bar (Electron) / Top Bar (Web) -->
    <header id="titlebar">
      <div class="titlebar-drag-region">
        <span class="titlebar-logo">Nova</span>
        <span class="titlebar-subtitle">Sub-Agent IDE</span>
      </div>
      <div class="titlebar-actions">
        <button class="titlebar-btn" id="btn-minimize" title="Minimize">&#x2013;</button>
        <button class="titlebar-btn" id="btn-maximize" title="Maximize">&#x25A1;</button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="Close">&#x2715;</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div id="workspace">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-panel="explorer" title="Explorer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="sidebar-tab" data-panel="search" title="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <button class="sidebar-tab" data-panel="git" title="Source Control">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg>
          </button>
          <button class="sidebar-tab" data-panel="extensions" title="Extensions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
          <button class="sidebar-tab" data-panel="agents" title="Sub-Agents">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 0-4 4v2a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"/><path d="M6 10v1a6 6 0 0 0 12 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
          </button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
          <!-- Explorer Panel -->
          <div class="sidebar-panel active" id="panel-explorer">
            <div class="panel-header">
              <span>Explorer</span>
              <div class="panel-actions">
                <button class="icon-btn" title="New File"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
                <button class="icon-btn" title="New Folder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>
                <button class="icon-btn" title="Collapse All"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
              </div>
            </div>
            <div class="panel-section">
              <div class="section-header collapsed" data-section="open-editors">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                OPEN EDITORS
              </div>
              <div class="section-content" id="open-editors"></div>
            </div>
            <div class="panel-section">
              <div class="section-header" data-section="workspace">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                <span id="workspace-name">NOVA IDE</span>
              </div>
              <div class="section-content" id="file-tree"></div>
            </div>
          </div>

          <!-- Search Panel -->
          <div class="sidebar-panel" id="panel-search">
            <div class="panel-header"><span>Search</span></div>
            <div class="search-container">
              <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search across files..." id="search-input" />
                <div class="search-options">
                  <button class="icon-btn small" title="Match Case" id="search-case">Aa</button>
                  <button class="icon-btn small" title="Whole Word" id="search-word">Ab</button>
                  <button class="icon-btn small" title="Use Regex" id="search-regex">.*</button>
                </div>
              </div>
              <div class="search-replace-wrapper" id="search-replace" style="display:none;">
                <input type="text" class="search-input" placeholder="Replace..." id="replace-input" />
              </div>
              <div id="search-results" class="search-results"></div>
            </div>
          </div>

          <!-- Git Panel -->
          <div class="sidebar-panel" id="panel-git">
            <div class="panel-header"><span>Source Control</span></div>
            <div class="git-container">
              <div class="git-commit-box">
                <textarea class="git-commit-input" placeholder="Commit message..." rows="3" id="git-commit-message"></textarea>
                <button class="btn btn-primary btn-sm" id="git-commit-btn">Commit</button>
              </div>
              <div class="git-changes" id="git-changes"></div>
            </div>
          </div>

          <!-- Extensions Panel -->
          <div class="sidebar-panel" id="panel-extensions">
            <div class="panel-header"><span>Extensions</span></div>
            <div class="extensions-container" id="extensions-list"></div>
          </div>

          <!-- Sub-Agents Panel -->
          <div class="sidebar-panel" id="panel-agents">
            <div class="panel-header"><span>Sub-Agents</span></div>
            <div class="agents-container" id="agents-list">
              <div class="agent-card">
                <div class="agent-status online"></div>
                <div class="agent-info">
                  <div class="agent-name">Code Assistant</div>
                  <div class="agent-desc">Ready</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Resize Handle -->
      <div class="resize-handle vertical" id="sidebar-resize"></div>

      <!-- Main Area -->
      <main id="main-area">
        <!-- Editor Tabs -->
        <div id="editor-tabs">
          <div class="tabs-scroll">
            <div class="tabs-container" id="tabs-container"></div>
          </div>
          <div class="tabs-actions">
            <button class="icon-btn small" title="Split Editor"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg></button>
          </div>
        </div>

        <!-- Editor Area -->
        <div id="editor-area">
          <div id="welcome-view" class="welcome-view">
            <div class="welcome-content">
              <h1 class="welcome-logo">Nova</h1>
              <p class="welcome-tagline">Sub-Agent IDE</p>
              <div class="welcome-actions">
                <div class="welcome-action" id="welcome-open-file">
                  <kbd>Ctrl+O</kbd>
                  <span>Open File</span>
                </div>
                <div class="welcome-action" id="welcome-open-folder">
                  <kbd>Ctrl+K O</kbd>
                  <span>Open Folder</span>
                </div>
                <div class="welcome-action" id="welcome-new-file">
                  <kbd>Ctrl+N</kbd>
                  <span>New File</span>
                </div>
                <div class="welcome-action" id="welcome-new-terminal">
                  <kbd>Ctrl+`</kbd>
                  <span>New Terminal</span>
                </div>
              </div>
              <div class="welcome-recent">
                <h3>Recent</h3>
                <div id="recent-files"></div>
              </div>
            </div>
          </div>
          <div id="editor-container" style="display:none;"></div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle horizontal" id="terminal-resize"></div>

        <!-- Bottom Panel (Terminal / Output / Problems) -->
        <div id="bottom-panel">
          <div class="panel-tab-bar">
            <button class="panel-tab active" data-panel="terminal">Terminal</button>
            <button class="panel-tab" data-panel="output">Output</button>
            <button class="panel-tab" data-panel="problems">Problems <span class="badge" id="problems-badge" style="display:none;">0</span></button>
          </div>
          <div class="panel-content">
            <div class="panel-view active" id="view-terminal">
              <div class="terminal-container" id="terminal-container">
                <div class="terminal-output" id="terminal-output"></div>
                <div class="terminal-input-row">
                  <span class="terminal-prompt">❯</span>
                  <input type="text" class="terminal-input" id="terminal-input" spellcheck="false" autocomplete="off" placeholder="Type a command..." />
                </div>
              </div>
            </div>
            <div class="panel-view" id="view-output">
              <div class="terminal-container"><div class="terminal-output" id="output-log"></div></div>
            </div>
            <div class="panel-view" id="view-problems">
              <div class="problems-list" id="problems-list"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Status Bar -->
    <footer id="statusbar">
      <div class="status-left">
        <span class="status-item branch" id="status-branch">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg>
          main
        </span>
        <span class="status-item" id="status-sync">0↓ 0↑</span>
      </div>
      <div class="status-right">
        <span class="status-item" id="status-errors" title="Errors">0 <span class="status-icon error">✕</span></span>
        <span class="status-item" id="status-warnings" title="Warnings">0 <span class="status-icon warning">⚠</span></span>
        <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
        <span class="status-item" id="status-encoding">UTF-8</span>
        <span class="status-item" id="status-eol">LF</span>
        <span class="status-item" id="status-language">Plain Text</span>
        <span class="status-item clickable" id="status-notifications" title="Notifications">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </span>
      </div>
    </footer>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu" style="display:none;"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header" id="modal-header"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Notification Container -->
  <div id="notifications" class="notification-container"></div>

  <!-- Monaco Editor Loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    // ─── Bootstrap ──────────────────────────────────────────────────────────
    window.__NOVA_READY__ = false;

    // Monaco Editor Setup
    require.config({
      paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" },
    });

    require(["vs/editor/editor.main"], function () {
      window.monaco = monaco;
      window.__NOVA_READY__ = true;
      document.dispatchEvent(new Event("nova:ready"));
    });

    // ─── Panel Switching ──────────────────────────────────────────────────
    document.querySelectorAll(".sidebar-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".sidebar-tab").forEach(function (t) { t.classList.remove("active"); });
        document.querySelectorAll(".sidebar-panel").forEach(function (p) { p.classList.remove("active"); });
        tab.classList.add("active");
        var panelId = "panel-" + tab.getAttribute("data-panel");
        var panel = document.getElementById(panelId);
        if (panel) panel.classList.add("active");
      });
    });

    // ─── Bottom Panel Tabs ────────────────────────────────────────────────
    document.querySelectorAll(".panel-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".panel-tab").forEach(function (t) { t.classList.remove("active"); });
        document.querySelectorAll(".panel-view").forEach(function (v) { v.classList.remove("active"); });
        tab.classList.add("active");
        var viewId = "view-" + tab.getAttribute("data-panel");
        var view = document.getElementById(viewId);
        if (view) view.classList.add("active");
      });
    });

    // ─── Section Collapse Toggle ──────────────────────────────────────────
    document.querySelectorAll(".section-header").forEach(function (header) {
      header.addEventListener("click", function () {
        header.classList.toggle("collapsed");
      });
    });

    // ─── Search Toggle Replace ────────────────────────────────────────────
    document.getElementById("search-input").addEventListener("focus", function () {
      document.getElementById("search-replace").style.display = "block";
    });

    // ─── Terminal Input ───────────────────────────────────────────────────
    var termInput = document.getElementById("terminal-input");
    var termOutput = document.getElementById("terminal-output");
    var commandHistory = [];
    var historyIndex = -1;

    termInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var cmd = termInput.value.trim();
        if (!cmd) return;
        commandHistory.push(cmd);
        historyIndex = commandHistory.length;
        appendTerminalLine("❯ " + cmd, "terminal-command");
        if (window.nova && window.nova.terminal) {
          window.nova.terminal.execute(cmd).then(function (result) {
            if (result.stdout) appendTerminalLine(result.stdout, "terminal-stdout");
            if (result.stderr) appendTerminalLine(result.stderr, "terminal-stderr");
          }).catch(function (err) {
            appendTerminalLine(String(err), "terminal-stderr");
          });
        } else {
          appendTerminalLine("Terminal not available (web mode)", "terminal-stderr");
        }
        termInput.value = "";
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (historyIndex > 0) {
          historyIndex--;
          termInput.value = commandHistory[historyIndex];
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          termInput.value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          termInput.value = "";
        }
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault();
        termOutput.innerHTML = "";
      }
    });

    function appendTerminalLine(text, className) {
      var line = document.createElement("div");
      line.className = "terminal-line " + (className || "");
      line.textContent = text;
      termOutput.appendChild(line);
      termOutput.scrollTop = termOutput.scrollHeight;
    }

    // ─── Resize Handles ───────────────────────────────────────────────────
    (function () {
      var sidebarResize = document.getElementById("sidebar-resize");
      var sidebar = document.getElementById("sidebar");
      var termResize = document.getElementById("terminal-resize");
      var bottomPanel = document.getElementById("bottom-panel");
      var dragging = null;

      sidebarResize.addEventListener("mousedown", function (e) {
        dragging = "sidebar";
        document.body.style.cursor = "col-resize";
        e.preventDefault();
      });

      termResize.addEventListener("mousedown", function (e) {
        dragging = "terminal";
        document.body.style.cursor = "row-resize";
        e.preventDefault();
      });

      document.addEventListener("mousemove", function (e) {
        if (dragging === "sidebar") {
          var w = Math.max(180, Math.min(500, e.clientX));
          sidebar.style.width = w + "px";
        } else if (dragging === "terminal") {
          var rect = bottomPanel.parentElement.getBoundingClientRect();
          var h = Math.max(100, Math.min(500, rect.bottom - e.clientY));
          bottomPanel.style.height = h + "px";
        }
      });

      document.addEventListener("mouseup", function () {
        dragging = null;
        document.body.style.cursor = "";
      });
    })();

    // ─── Context Menu ─────────────────────────────────────────────────────
    var contextMenu = document.getElementById("context-menu");

    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest("#terminal-container") || e.target.closest("#editor-container")) {
        e.preventDefault();
        var items = [];
        if (e.target.closest("#terminal-container")) {
          items = [
            { label: "Copy", action: function () { document.execCommand("copy"); } },
            { label: "Paste", action: function () { document.execCommand("paste"); } },
            { label: "Clear", action: function () { termOutput.innerHTML = ""; } },
          ];
        } else {
          items = [
            { label: "Cut", action: function () { document.execCommand("cut"); } },
            { label: "Copy", action: function () { document.execCommand("copy"); } },
            { label: "Paste", action: function () { document.execCommand("paste"); } },
            { type: "separator" },
            { label: "Go to Definition" },
            { label: "Find References" },
            { label: "Rename Symbol" },
          ];
        }
        showContextMenu(e.clientX, e.clientY, items);
      }
    });

    document.addEventListener("click", function () {
      contextMenu.style.display = "none";
    });

    function showContextMenu(x, y, items) {
      contextMenu.innerHTML = "";
      items.forEach(function (item) {
        if (item.type === "separator") {
          var sep = document.createElement("div");
          sep.className = "context-menu-separator";
          contextMenu.appendChild(sep);
        } else {
          var el = document.createElement("div");
          el.className = "context-menu-item";
          el.textContent = item.label;
          if (item.action) el.addEventListener("click", item.action);
          contextMenu.appendChild(el);
        }
      });
      contextMenu.style.left = x + "px";
      contextMenu.style.top = y + "px";
      contextMenu.style.display = "block";
    }

    // ─── Keyboard Shortcuts ───────────────────────────────────────────────
    document.addEventListener("keydown", function (e) {
      var ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && e.key === "`") {
        e.preventDefault();
        document.querySelector('.panel-tab[data-panel="terminal"]').click();
        termInput.focus();
      }
      if (ctrl && e.key === "b") {
        e.preventDefault();
        sidebar.style.display = sidebar.style.display === "none" ? "" : "none";
      }
      if (ctrl && e.key === "j") {
        e.preventDefault();
        bottomPanel.style.display = bottomPanel.style.display === "none" ? "" : "none";
      }
    });

    // ─── Title Bar Actions (Electron only) ────────────────────────────────
    document.getElementById("btn-minimize")?.addEventListener("click", function () {
      window.nova?.app?.minimize?.();
    });
    document.getElementById("btn-maximize")?.addEventListener("click", function () {
      window.nova?.app?.maximize?.();
    });
    document.getElementById("btn-close")?.addEventListener("click", function () {
      window.nova?.app?.close?.();
    });
  </script>
</body>
</html>
